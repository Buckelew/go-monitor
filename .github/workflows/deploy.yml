name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/buckelew/go-monitor

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          sudo apt-get install -y -qq sshpass > /dev/null 2>&1
          sshpass -p "$DEPLOY_PASSWORD" ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" "\
            echo '${{ secrets.GHCR_TOKEN }}' | docker login ghcr.io -u buckelew --password-stdin && \
            cd /opt/go-monitor && \
            git pull && \
            docker compose -f docker-compose.prod.yml pull app && \
            docker compose -f docker-compose.prod.yml up -d"
