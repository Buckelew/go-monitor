services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: go_monitor
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monitor -d go_monitor"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    image: migrate/migrate:v4.17.0
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command: ["-path", "/migrations", "-database", "postgres://monitor:${POSTGRES_PASSWORD}@db:5432/go_monitor?sslmode=disable", "up"]

  app:
    image: ghcr.io/buckelew/go-monitor:latest
    restart: unless-stopped
    mem_limit: 512m
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3001:3000"
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:6060:6060"
    environment:
      LOG_LEVEL: info
      ENV: production
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB_NAME: go_monitor
      POSTGRES_TEST_DB_NAME: go_monitor_test
      POSTGRES_USER: monitor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_URL: postgres://monitor:${POSTGRES_PASSWORD}@db:5432/go_monitor?sslmode=disable
      POSTGRES_TEST_URL: postgres://monitor:${POSTGRES_PASSWORD}@db:5432/go_monitor_test?sslmode=disable
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_REDIRECT_URL: https://monitors.pacificaio.com/auth/discord/callback
      API_PORT: "3000"
      WEB_PORT: "8080"
      SESSION_SECRET: ${SESSION_SECRET}

volumes:
  pgdata:
