{{define "layout"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>go-monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    <aside class="sidebar">
        <a href="/" class="sidebar-logo">
            <span class="sidebar-logo-dot"></span>
            go-monitor
        </a>
        <nav class="sidebar-nav">
            <a href="/dashboard" class="sidebar-link{{if eq .ActivePage "dashboard"}} active{{end}}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                Dashboard
            </a>
            {{if .IsAdmin}}
            <div class="sidebar-section">Admin</div>
            <a href="/tasks" class="sidebar-link{{if eq .ActivePage "tasks"}} active{{end}}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                Tasks
            </a>
            <a href="/logs" class="sidebar-link{{if eq .ActivePage "logs"}} active{{end}}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                Logs
            </a>
            <a href="/proxies" class="sidebar-link{{if eq .ActivePage "proxies"}} active{{end}}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"/><rect x="2" y="14" width="20" height="8" rx="2" ry="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/></svg>
                Proxies
            </a>
            {{end}}
        </nav>
        <div class="sidebar-footer">
            {{if .User.Username}}
            <div class="sidebar-user">
                <span class="sidebar-user-name">{{.User.Username}}</span>
                <form method="POST" action="/auth/logout" style="display:inline">
                    <button type="submit" class="btn-icon btn-logout" title="Logout">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </button>
                </form>
            </div>
            {{end}}
        </div>
    </aside>
    <main class="main">
        <div class="container">
            {{template "content" .}}
        </div>
    </main>
<script>
document.querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
        const table = th.closest('table');
        const tbody = table.querySelector('tbody');
        const idx = Array.from(th.parentNode.children).indexOf(th);
        const type = th.dataset.sort;
        const asc = !th.classList.contains('sort-asc');

        th.parentNode.querySelectorAll('th').forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
        th.classList.add(asc ? 'sort-asc' : 'sort-desc');

        const rows = Array.from(tbody.querySelectorAll('tr:not(.sentinel)'));
        rows.sort((a, b) => {
            const cellA = a.children[idx], cellB = b.children[idx];
            let va, vb;
            if (type === 'number') {
                va = parseFloat(cellA.dataset.sortValue || cellA.textContent) || 0;
                vb = parseFloat(cellB.dataset.sortValue || cellB.textContent) || 0;
            } else if (type === 'value') {
                va = cellA.dataset.sortValue || '';
                vb = cellB.dataset.sortValue || '';
            } else {
                va = cellA.textContent.trim().toLowerCase();
                vb = cellB.textContent.trim().toLowerCase();
            }
            if (va < vb) return asc ? -1 : 1;
            if (va > vb) return asc ? 1 : -1;
            return 0;
        });
        rows.forEach(r => tbody.appendChild(r));
    });
});
</script>
</body>
</html>
{{end}}
